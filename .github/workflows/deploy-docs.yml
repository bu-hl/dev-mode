# 워크플로우의 이름
name: Deploy JSDoc to GitHub Pages

# 언제 이 워크플로우를 실행할지 정의
on:
  # team5 브랜치에 push 이벤트가 발생할 때마다 실행
  push:
    branches:
      - team5

# 워크플로우 실행에 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 작업(jobs) 정의
jobs:
  deploy:
    # 배포 환경을 github-pages로 지정
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 실행될 가상 머신의 종류
    runs-on: ubuntu-latest
    # 실제 수행할 단계(steps)들
    steps:
      # 1. 저장소 코드를 가상 머신으로 내려받기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 환경 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 프로젝트에 맞는 버전
          cache: 'npm'

      # 3. npm 의존성 설치 (jsdoc 포함)
      - name: Install dependencies
        run: npm install

      # 4. JSDoc 문서 빌드 (package.json의 스크립트 실행)
      - name: Build JSDoc
        run: npm run docs

      # 4.1 백엔드 API(Markdown)를 HTML로 변환하여 동일 산출물에 포함
      - name: Convert API.md to HTML
        run: npx --yes marked -i API.md -o docs/frontend/backend-api.html

      # 4.2 README가 참조하는 정적 자산(이미지 등) 포함
      - name: Copy static assets
        run: |
          mkdir -p docs/frontend/assets
          cp -r assets/* docs/frontend/assets/

      # 5. GitHub Pages에 배포할 결과물을 준비
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. 빌드 결과물(docs/frontend 폴더)을 아티팩트로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/frontend'

      # 7. GitHub Pages에 최종 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
